# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Build for all architectures including arm64-v8a for 16 KB page size support
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

android.kotlinVersion=2.1.20
# New Architecture — enabled for SDK 54 / RN 0.81+
# RN 0.81 ships 16 KB-aligned .so files with New Architecture
newArchEnabled=true

# Hermes JS engine
hermesEnabled=true

# GIF / WebP support
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Do not extract native libs — required for 16 KB page size support
expo.useLegacyPackaging=false

# Force SDK versions to meet Play Store requirements (overrides build.gradle defaults)
android.targetSdkVersion=36
android.compileSdkVersion=36
android.buildToolsVersion=36.0.0
