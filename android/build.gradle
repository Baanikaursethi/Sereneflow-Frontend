// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Expo SDK 54 / React Native 0.81 use the Expo root-project Gradle plugin, which
// supplies the SDK, NDK, Kotlin and Java versions (compileSdk 36, targetSdk 36,
// Kotlin 2.1.x, NDK 27.x) instead of the hand-maintained `ext` block used by the
// SDK 51 template. NDK r27 + AGP 8.11 are the versions that can produce 16 KB
// aligned native libraries — but alignment must still be verified on the built
// artifact, see scripts/verify-16kb.js.
apply plugin: "expo-root-project"
